<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlowCare - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login-style.css">
</head>
<body>

  <!-- PARTICLE CANVAS -->
  <canvas id="particleCanvas"></canvas>

  <!-- LOGIN BOX -->
  <div class="auth-container active" id="loginBox">
    <h2>Login</h2>
    <div class="input-group">
      <input type="email" id="loginEmail" placeholder=" " required>
      <label>Email</label>
    </div>
    <div class="input-group">
      <input type="password" id="loginPassword" placeholder=" " required>
      <label>Password</label>
    </div>
    <button class="btn" onclick="login()">Login</button>
    <div class="toggle-text">New here? <span onclick="window.location='signup.html'">Sign Up</span></div>
  </div>

  <script src="login-script.js"></script>
</body>
</html>
