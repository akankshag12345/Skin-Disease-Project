<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlowCare - Sign Up</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="signup-style.css">
</head>
<body>

  <!-- PARTICLE CANVAS -->
  <canvas id="particleCanvas"></canvas>

  <!-- SIGNUP BOX -->
  <div class="auth-container active" id="signupBox">
    <h2>Sign Up</h2>
    <div class="input-group">
      <input type="text" id="signupName" placeholder=" " required>
      <label>Username</label>
    </div>
    <div class="input-group">
      <input type="email" id="signupEmail" placeholder=" " required>
      <label>Email</label>
    </div>
    <div class="input-group">
      <input type="password" id="signupPassword" placeholder=" " required>
      <label>Password</label>
    </div>
    <button class="btn" onclick="signup()">Sign Up</button>
    <div class="toggle-text">Already have an account? <span onclick="window.location='login.html'">Login</span></div>
  </div>

  <script src="signup-script.js"></script>
</body>
</html>
